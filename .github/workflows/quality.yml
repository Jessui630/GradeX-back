name: GradeX .NET quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Analyze, build and test (no database)
        shell: pwsh
        run: ./scripts/quality.ps1 -OutputDirectory '${{ runner.temp }}/gradex-quality' -FailOnWarnings
      - name: Upload logs, SARIF and TRX even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gradex-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gradex-quality
          if-no-files-found: warn
          retention-days: 14
