name: SonarCloud analysis (manual activation)

# Flujo manual y desactivado por defecto. No se ejecuta en push ni en pull_request
# para conservar el análisis automático y el Quality Gate actuales hasta que un
# administrador de SonarCloud desactive Automatic Analysis. La autenticación es
# secretless: SonarSource/sonarqube-auth-action intercambia el token OIDC de GitHub
# por una credencial temporal; no se almacena SONAR_TOKEN.
on:
  workflow_dispatch:
    inputs:
      automatic_analysis_disabled:
        description: 'Confirmo que Automatic Analysis está desactivado en SonarCloud'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  guard:
    name: Require develop
    runs-on: ubuntu-latest
    steps:
      - name: Reject analysis outside develop
        if: github.ref != 'refs/heads/develop' || github.event_name != 'workflow_dispatch'
        run: |
          echo "::error::El análisis secretless solo se autoriza desde develop mediante workflow_dispatch."
          exit 1

  sonar:
    needs: guard
    if: ${{ inputs.automatic_analysis_disabled }}
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Setup Java for SonarScanner
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SonarScanner for .NET
        shell: pwsh
        run: |
          dotnet tool install --global dotnet-sonarscanner --version 12.1.0
          "$env:USERPROFILE\.dotnet\tools" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Initialize LocalDB integration database
        shell: pwsh
        run: ./scripts/Initialize-GradeXIntegrationDb.ps1

      - name: Authenticate to SonarQube Cloud with OIDC
        id: sonar-auth
        uses: SonarSource/sonarqube-auth-action@a0aa643acde4162396015b4f12536c1b9c4aab82 # v1
        with:
          project-key: Jessui630_GradeX-back
          export-env: 'false'

      - name: Begin SonarCloud analysis
        id: begin
        shell: bash
        env:
          SONAR_TOKEN: ${{ steps.sonar-auth.outputs.sonar-token }}
        run: |
          dotnet sonarscanner begin \
            /k:"Jessui630_GradeX-back" \
            /o:"jessui630" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.opencover.reportsPaths="coverage/sonar/**/coverage.opencover.xml" \
            /d:sonar.token="$SONAR_TOKEN"

      - name: Build instrumented by SonarScanner
        run: dotnet build GradeX.slnx --configuration Release --nologo

      - name: Test with OpenCover coverage
        shell: pwsh
        env:
          GRADEX_INTEGRATION_TEST_CONNECTION: 'Server=(localdb)\MSSQLLocalDB;Database=GradeX_IntegrationTests;Trusted_Connection=True;TrustServerCertificate=True'
        run: |
          dotnet test GradeX.slnx --configuration Release --no-build --nologo `
            --settings tests/GradeX.Tests/coverage.opencover.runsettings `
            --collect:"XPlat Code Coverage" `
            --results-directory coverage/sonar `
            --logger "trx;LogFileName=tests.trx"

      - name: Require real SQL execution
        shell: pwsh
        run: |
          $trx = Get-ChildItem coverage/sonar -Recurse -Filter tests.trx |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $trx) { throw 'No se generó el archivo TRX.' }
          [xml]$doc = Get-Content -LiteralPath $trx.FullName -Raw
          $results = @($doc.GetElementsByTagName('UnitTestResult'))
          $passed = @($results | Where-Object { $_.outcome -eq 'Passed' }).Count
          $skipped = @($results | Where-Object { $_.outcome -eq 'NotExecuted' })
          $unexpected = @($skipped | Where-Object {
            $_.testName -notmatch 'PwnedPasswordsLiveTests'
          })
          if ($unexpected.Count -gt 0) {
            $names = $unexpected | ForEach-Object { $_.testName }
            throw "Pruebas omitidas inesperadamente: $($names -join ', ')"
          }
          if ($passed -lt 126) {
            throw "Solo $passed pruebas correctas; se esperaban al menos 126 con SQL."
          }
          Write-Host "SQL real: $passed correctas, $($skipped.Count) omitida(s) externas."

      - name: Verify OpenCover report
        shell: pwsh
        run: |
          $report = Get-ChildItem coverage/sonar -Recurse `
            -Filter coverage.opencover.xml -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $report) {
            throw 'No se generó coverage.opencover.xml.'
          }
          [xml]$xml = Get-Content -LiteralPath $report.FullName -Raw
          if ($xml.DocumentElement.LocalName -ne 'CoverageSession') {
            throw "Raíz XML inesperada: $($xml.DocumentElement.LocalName)"
          }
          $summary = $xml.SelectSingleNode('/CoverageSession/Summary')
          if (-not $summary) {
            throw 'Falta Summary en el reporte OpenCover.'
          }
          $total = [int]$summary.numSequencePoints
          $visited = [int]$summary.visitedSequencePoints
          $points = @($xml.SelectNodes('//SequencePoint')).Count
          if ($total -le 0 -or $visited -le 0 -or $points -le 0) {
            throw 'El reporte no contiene cobertura real.'
          }
          $repo = (Get-Location).Path
          $checked = 0
          foreach ($file in @($xml.SelectNodes('//File'))) {
            $full = [string]$file.fullPath
            if ([string]::IsNullOrWhiteSpace($full)) { continue }
            $relative = [System.IO.Path]::GetRelativePath($repo, $full)
            if ($relative.StartsWith('..')) { continue }
            if ($relative -match '(^|[\\/])(obj|bin)([\\/]|$)') { continue }
            if (-not (Test-Path -LiteralPath $full -PathType Leaf)) {
              throw "Falta el archivo fuente: $relative"
            }
            $checked++
          }
          if ($checked -le 0) {
            throw 'El reporte no referencia archivos fuente del repositorio.'
          }
          Write-Host "OpenCover válido: $visited/$total puntos de secuencia, $points entradas, $checked archivos fuente"

      - name: End SonarCloud analysis
        if: always() && steps.begin.outcome == 'success'
        shell: pwsh
        env:
          SONAR_TOKEN: ${{ steps.sonar-auth.outputs.sonar-token }}
        run: dotnet sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"

      - name: Upload coverage and test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gradex-sonar-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/sonar/
          if-no-files-found: warn
          retention-days: 14

      - name: Drop LocalDB integration database
        if: always()
        shell: pwsh
        continue-on-error: true
        run: ./scripts/Initialize-GradeXIntegrationDb.ps1 -Drop
