name: SonarCloud analysis (manual activation)

# Flujo manual y desactivado por defecto. No se ejecuta en push ni en pull_request
# para conservar el análisis automático y el Quality Gate actuales hasta que un
# administrador de SonarCloud desactive Automatic Analysis. La autenticación es
# secretless: SonarSource/sonarqube-auth-action intercambia el token OIDC de GitHub
# por una credencial temporal; no se almacena SONAR_TOKEN.
on:
  workflow_dispatch:
    inputs:
      automatic_analysis_disabled:
        description: 'Confirmo que Automatic Analysis está desactivado en SonarCloud'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  guard:
    name: Require develop
    runs-on: ubuntu-latest
    steps:
      - name: Reject analysis outside develop
        if: github.ref != 'refs/heads/develop' || github.event_name != 'workflow_dispatch'
        run: |
          echo "::error::El análisis secretless solo se autoriza desde develop mediante workflow_dispatch."
          exit 1

  sonar:
    needs: guard
    if: ${{ inputs.automatic_analysis_disabled }}
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Setup Java for SonarScanner
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SonarScanner for .NET
        shell: pwsh
        run: |
          dotnet tool install --global dotnet-sonarscanner --version 12.1.0
          "$env:USERPROFILE\.dotnet\tools" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Authenticate to SonarQube Cloud with OIDC
        id: sonar-auth
        uses: SonarSource/sonarqube-auth-action@a0aa643acde4162396015b4f12536c1b9c4aab82 # v1
        with:
          project-key: Jessui630_GradeX-back
          export-env: 'false'

      - name: Begin SonarCloud analysis
        id: begin
        shell: bash
        env:
          SONAR_TOKEN: ${{ steps.sonar-auth.outputs.sonar-token }}
        run: |
          dotnet sonarscanner begin \
            /k:"Jessui630_GradeX-back" \
            /o:"jessui630" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.opencover.reportsPaths="coverage/sonar/**/coverage.opencover.xml" \
            /d:sonar.token="$SONAR_TOKEN"

      - name: Build instrumented by SonarScanner
        run: dotnet build GradeX.slnx --configuration Release --nologo

      - name: Initialize LocalDB integration database after instrumented build
        shell: pwsh
        run: ./scripts/Initialize-GradeXIntegrationDb.ps1 -NoBuild

      - name: Run full test suite with SQL and OpenCover
        shell: pwsh
        run: ./scripts/Run-GradeXTestsWithOpenCover.ps1

      - name: End SonarCloud analysis
        if: always() && steps.begin.outcome == 'success'
        shell: pwsh
        env:
          SONAR_TOKEN: ${{ steps.sonar-auth.outputs.sonar-token }}
        run: dotnet sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"

      - name: Upload coverage and test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gradex-sonar-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/sonar/
          if-no-files-found: warn
          retention-days: 14

      - name: Drop LocalDB integration database
        if: always()
        shell: pwsh
        continue-on-error: true
        run: ./scripts/Initialize-GradeXIntegrationDb.ps1 -Drop -NoBuild
