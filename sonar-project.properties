sonar.projectKey=Jessui630_GradeX-back
sonar.organization=jessui630
sonar.projectName=GradeX-back
sonar.host.url=https://sonarcloud.io

sonar.sourceEncoding=UTF-8
sonar.sources=src
sonar.tests=tests

# SonarScanner for .NET imports OpenCover, not Cobertura. The manual workflow
# generates this report with tests/GradeX.Tests/coverage.opencover.runsettings.
sonar.cs.opencover.reportsPaths=coverage/sonar/**/coverage.opencover.xml
sonar.cs.vstest.reportsPaths=coverage/sonar/**/*.trx

# Keep the current GitHub check as the merge gate until the first CI analysis
# has been validated by a SonarCloud administrator.
sonar.qualitygate.wait=false
